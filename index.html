<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header">
        <h1>Carbon Footprint Tracker</h1>
        <button id="theme-toggle"
         aria-label="Toggle light and dark mode">🌙 Dark mode</button>
        </div>  
        <p>Log what you do each day and track how much C02 it adds up to.</p>
    </header>
    <main>
        <section class="card">
            <h2>Emission Target</h2>
            <label>
                Weekly CO2 Budget(kg)
                <input type="number" id="budget-input" value="50" min="1" step="any">
            </label>
            <p id="budget-status" style="margin-top: 8px; font-weight: bold; font-size: 14px;"></p>
        </section>
        <section class = "summary">
            <div class = "card">
                <h2>Today</h2>
                <p class="big">kg CO2</p>
            </div>
            <div class="card">
                <h2>Last 7 Days</h2>
                <p class="big">kg CO2</p>
            </div>
        </section>
        <section class="card">
            <h2>Log an activity</h2>
            <form id="log-form">
                <label for="category">
                    Category
                    <select id = "category"></select>
                </label>
                <label for="activity">
                    Activity
                    <select id = "activity"></select>
                </label>
                <label>
                    Amount
                    <input type="number" id="amount" min="0" step="any" value="1" required>
                </label>
                <label>
                    Date
                    <input type="date" id="date" required>
                </label>
                <button type="submit">Add entry</button>
            </form>
        </section>
        <section class="card">
            <h2>Emissions Breakdown</h2>
            <div class="chart-container">
                <div class="chart-bar-wrapper">
                    <div class="chart-bar-track">
                        <div id="bar-transport" class="chart-fill" style="height: 0%"></div>
                    </div>
                    <span class="chart-label">Transport</span>
                    <span id="val-transport" class="chart-value">0 kg</span>
                </div>
                <div class="chart-bar-wrapper">
                    <div class="chart-bar-track">
                        <div id="bar-energy" class="chart-fill" style="height: 0%"></div>
                    </div>
                    <span class="chart-label">Energy</span>
                    <span id="val-energy" class="chart-value">0 kg</span>
                </div>
                <div class="chart-bar-wrapper">
                    <div class="chart-bar-track">
                        <div id="bar-food" class="chart-fill" style="height: 0%"></div>
                    </div>
                    <span class="chart-label">Food</span>
                    <span id="val-food" class="chart-value">0 kg</span>
                </div>
            </div>
        </section>
        <section class="card">
            <h2>Activity History</h2>
            <ul id="activity-list" style="list-style-type:none;padding:0;">
                <p style="color: grey;">no activities logged yet</p>
            </ul>
            <button id="clear-btn">Clear History</button>
        </section>
    </main>
    <script src="script.js"></script>
    <div id="toast" class="toast">Activity logged successfully!</div>
</body>
</html>
